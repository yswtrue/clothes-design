name: clothes-design

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - clothes-design-net

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clothes_design}
  REDIS_URL: redis://redis:6379/0
  REDIS_QUEUE_URL: redis://redis:6379/1
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/tmp/clothes-design/uploads}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-clothes-design}
  AWS_S3_USE_PATH_STYLE: "true"
  AWS_REGION: us-east-1
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STABILITY_AI_API_KEY: ${STABILITY_AI_API_KEY:-}
  VECTORIZER_AI_API_KEY: ${VECTORIZER_AI_API_KEY:-}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    container_name: clothes-design-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clothes_design}
    ports:
      - "${POSTGRES_FORWARD_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: clothes-design-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_FORWARD_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-maintenance:
    <<: *service-defaults
    profiles:
      - maintenance
    image: postgres:17-alpine
    container_name: clothes-design-db-maintenance
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/db-maintenance"]
    command: ["help"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-clothes_design}
      BACKUP_DIR: /backups
    volumes:
      - db_backups:/backups
      - ./docker/db-maintenance.sh:/usr/local/bin/db-maintenance:ro
    depends_on:
      postgres:
        condition: service_healthy

  traefik:
    <<: *service-defaults
    image: traefik:v3
    container_name: clothes-design-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/yswtrue/clothes-design-backend:latest
    command: ["python", "-m", "api", "--host", "0.0.0.0", "--port", "8000"]
    scale: ${BACKEND_REPLICAS:-2}
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${TRAEFIK_BACKEND_HOST:-api.localhost}`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.middlewares=redirect-to-https"
      - "traefik.http.routers.backend-secure.rule=Host(`${TRAEFIK_BACKEND_HOST:-api.localhost}`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-secure.tls=true"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-migrate:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/yswtrue/clothes-design-backend:latest
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ghcr.io/yswtrue/clothes-design-worker:latest
    container_name: clothes-design-worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    <<: *service-defaults
    profiles:
      - frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://localhost:8000}
    container_name: clothes-design-frontend
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://localhost:8000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${TRAEFIK_FRONTEND_HOST:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend-secure.rule=Host(`${TRAEFIK_FRONTEND_HOST:-localhost}`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  clothes-design-net:

volumes:
  postgres_data:
  db_backups:
  redis_data:
  traefik_letsencrypt:
