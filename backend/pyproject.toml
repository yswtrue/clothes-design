[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-design-api"
version = "0.1.0"
description = "FastAPI backend for Clothes Design platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clothes Design Team" }]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "aiosqlite>=0.20.0",
    "redis[hiredis]>=5.0.0",
    "filetype>=1.2.0",
    "aiohttp>=3.13.5",
    "pillow>=12.2.0",
    "boto3>=1.42.83",
    "fastapi-cache2[redis]>=0.1.8",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "boto3>=1.26.0",
    "moto[s3]>=4.1.0",
    "httpx>=0.27.0",
    "pyright>=1.1.350",
    "fakeredis>=2.20.0",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C90", "B", "A", "C4", "RUF"]
ignore = ["E501", "W291", "W292", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["clothes_design_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
strict = false
explicit_package_bases = true

[dependency-groups]
dev = [
    "aiohttp>=3.13.5",
    "httpx>=0.28.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "redis>=7.4.0",
]
