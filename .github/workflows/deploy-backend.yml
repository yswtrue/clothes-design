name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/clothes-design-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/clothes-design-backend:latest
          cache-to: type=inline

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/clothes-design-worker:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/clothes-design-worker:latest
          cache-to: type=inline

  deploy:
    environment: cicd
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd Code/clothes-design/
            echo ">>> git pull..."
            git pull
            echo ">>> Pulling images from ghcr.io..."
            docker compose pull backend backend-migrate worker
            echo ">>> Running database migrations..."
            docker compose run --rm backend-migrate
            echo ">>> Restarting backend + worker..."
            docker compose up -d backend worker
            echo ">>> Done."
